name: Native Builds

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  dispatch:
    name: Dispatch selected jobs
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Determine which native libraries the user has asked to build, and where to look for changes.
        id: parse
        shell: pwsh
        working-directory: eng/workflows/native
        env:
          COMMENT_BODY: ${{ github.event.pull_request.body }}
        run: ./workflow-parse.ps1 >> $env:GITHUB_OUTPUT

      - uses: dorny/paths-filter@v4
        id: filter
        name: Determine which natives need to be rebuilt.
        with:
          filters: ${{ steps.parse.outputs.workflow_filters }}

      - name: Find previous comment if it exists
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Silk Native Build"

      - name: Generate matrix
        id: matrix
        shell: pwsh
        working-directory: eng/workflows/native
        env:
          AFFECTED_JOBS: ${{ join(fromJSON(steps.filter.outputs.changes), ' ') }}
          CHOSEN_JOBS: ${{ steps.parse.outputs.jobs }}
          PREVIOUS_COMMENT_ID: ${{ steps.fc.outputs.comment-id }}
        run: ./workflow-matrix.ps1 >> $env:GITHUB_OUTPUT

      - name: Update comment
        if: ${{ steps.matrix.outputs.comment }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          body: ${{ steps.matrix.outputs.comment }}
          edit-mode: replace

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      jobs: ${{ steps.parse.outputs.jobs }}

  build:
    name: ${{ matrix.job }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    if: ${{ needs.dispatch.outputs.jobs }}
    needs: [dispatch]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.matrix) }}

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build
        run: |
          echo "https://github.com/actions/upload-artifact/issues/174" > .workaround-${{ matrix.job }}-${{ matrix.runtime }}.txt
          ${{ format('.{0}{1}', startsWith(matrix.runtime, 'win') && '\' || '/', matrix.exec) }}
        working-directory: ${{ matrix.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.job }}-${{ matrix.runtime }}
          path: |
            ./.workaround-*.txt
            ./${{ matrix.dir }}/runtimes/${{ format('{0}{1}', matrix.runtime, !contains(matrix.runtime, '-') && '*' || '') }}/**/*
            ./${{ matrix.dir }}/lib/*${{ matrix.runtime }}*/**/*
            ./${{ matrix.dir }}/*${{ matrix.runtime }}*/**/*

  commit:
    name: Commit Binaries
    runs-on: ubuntu-latest

    if: ${{ needs.dispatch.outputs.jobs }}
    needs: [dispatch, build]

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: false
          ref: ${{ github.head_ref }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true

      - name: Commit Artifacts
        run: |
          git config --local user.email "9011267+dotnet-bot@users.noreply.github.com"
          git config --local user.name "The Silk.NET Automaton"
          git add .
          git commit -m "Update native binaries for $(git rev-parse HEAD)"
          git push
