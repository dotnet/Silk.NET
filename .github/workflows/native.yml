name: Native Builds

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  dispatch:
    name: PR Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Determine which native libraries the user has asked to build, and where to look for changes.
        id: parse
        run: ./workflow-stage1.sh
        working-directory: eng/workflows/native
        env:
          PR_COMMENT: ${{ github.event.pull_request.body }}

      - uses: dorny/paths-filter@v3
        id: filter
        name: Determine which natives need to be rebuilt.
        with:
          filters: ${{ steps.parse.outputs.workflow_filters }}

      - name: Find a warning message from a previous run, if applicable.
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Some of the native library builds modified in this PR were not referenced in the PR description."

      - id: strat
        name: Create the matrix strategy for the native builds.
        run: ./workflow-stage2.sh
        working-directory: eng/workflows/native
        env:
          NATIVE_LIBRARY_APPLICABLE_SHORTHANDS: ${{ join(fromJSON(steps.filter.outputs.changes), ' ') }}
          NATIVE_LIBRARY_USER_REFERENCED_SHORTHANDS: ${{ steps.parse.outputs.targets_referenced }}
          PR_EXISTING_NOTICE_ID: ${{ steps.fc.outputs.comment-id }}

      - name: Write a comment if needed.
        if: ${{ steps.strat.outputs.comment_to_write }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          body: ${{ steps.strat.outputs.comment_to_write }}
          edit-mode: replace

    outputs:
      matrix_strategy: ${{ steps.strat.outputs.matrix_strategy }}
      targets_referenced: ${{ steps.parse.outputs.targets_referenced }}

  build:
    name: ${{ matrix.target }} / ${{ matrix.runtime }}
    runs-on: ${{ (startsWith(matrix.runtime, 'osx') || startsWith(matrix.runtime, 'ios') || startsWith(matrix.runtime, 'tvos')) && 'macos-latest' || startsWith(matrix.runtime, 'win') && 'windows-latest' || 'ubuntu-latest' }}

    needs: [dispatch]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.matrix_strategy) }}

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Build
        run: |
          echo "https://github.com/actions/upload-artifact/issues/174" > .workaround-${{ matrix.target }}-${{ matrix.runtime }}.txt
          ${{ format('.{0}{1}', startsWith(matrix.runtime, 'win') && '\' || '/', matrix.exec) }}
        working-directory: ${{ matrix.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.target }}-${{ matrix.runtime }}
          path: |
            ./.workaround-*.txt
            ./${{ matrix.dir }}/runtimes/${{ format('{0}{1}', matrix.runtime, !contains(matrix.runtime, '-') && '*' || '') }}/**/*
            ./${{ matrix.dir }}/lib/*${{ matrix.runtime }}*/**/*
            ./${{ matrix.dir }}/*${{ matrix.runtime }}*/**/*

  commit:
    name: Commit Binaries
    runs-on: ubuntu-latest

    if: ${{ needs.dispatch.outputs.targets_referenced }}
    needs: [dispatch, build]

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: false
          ref: ${{ github.head_ref }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true

      - name: Commit Artifacts
        run: |
          git config --local user.email "9011267+dotnet-bot@users.noreply.github.com"
          git config --local user.name "The Silk.NET Automaton"
          git add .
          git commit -m "Update native binaries for $(git rev-parse HEAD)"
          git push
