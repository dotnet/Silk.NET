name: Push bundle to PR

on:
  workflow_call:
    inputs:
      headRepo:
        type: string
        required: true
      headBranch:
        type: string
        required: true
      headCommit:
        type: string
        required: true
      bundleArtifact:
        type: string
        required: true
      bundlePath:
        type: string
        required: true

jobs:
  
  # Privileged - Must not execute untrusted code
  push:
    name: Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.bundleArtifact }}
          path: bundle

      - name: Show working directory contents
        shell: pwsh
        run: Get-ChildItem

      - name: Apply bundle
        shell: pwsh
        env:
          HEAD_REPO: ${{ inputs.headRepo }}
          HEAD_COMMIT: ${{ inputs.headCommit }}
          BUNDLE_PATH: ${{ inputs.bundlePath }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Creating bare repo"
          git init --bare repo.git
          $env:GIT_DIR = "$PWD/repo.git"
          git config core.hooksPath /dev/null
          git config transfer.fsckObjects true
          
          Write-Host "Applying bundle"
          git fetch --no-recurse-submodules --depth=1 "https://github.com/$env:HEAD_REPO.git" $env:HEAD_COMMIT
          git bundle verify bundle/$env:BUNDLE_PATH
          git fetch --no-recurse-submodules bundle/$env:BUNDLE_PATH refs/heads/ci/bundle
          git update-ref refs/heads/ci/bundle FETCH_HEAD

      - name: Push
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ inputs.headRepo }}
          HEAD_BRANCH: ${{ inputs.headBranch }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Pushing"
          $env:GIT_DIR = "$PWD/repo.git"
          git -c credential.helper= -c "credential.helper=!gh auth git-credential" push "https://github.com/$env:HEAD_REPO.git" "refs/heads/ci/bundle:refs/heads/$env:HEAD_BRANCH"
          Write-Host "Push successful"
