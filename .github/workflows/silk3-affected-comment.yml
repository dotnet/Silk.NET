name: Post Affected Natives/Bindings Comment (Silk 3)

on:
  workflow_run:
    workflows:
      - Check Affected Natives/Bindings
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number }}"
  cancel-in-progress: false

jobs:

  # Privileged - Must not execute untrusted code
  check:
    name: Post reminder comment
    runs-on: ubuntu-latest
    
    if: github.event.workflow_run.conclusion == 'success'
    
    permissions:
      pull-requests: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        type:
          - native
          - bindings

    env: 
      NATIVE_REMINDER_MESSAGE_PATTERN: |
        ## Silk.NET native build reminder
      BINDINGS_REMINDER_MESSAGE_PATTERN: |
        ## Silk.NET bindings regeneration reminder

    steps:

      # Workaround since `github.event.workflow_run.pull_requests[0].number` doesn't work
      # Note that this artifact is untrusted
      - name: Download PR number
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          path: pr-number
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR number
        id: pr
        shell: pwsh
        env:
          BASE_REPO: ${{ github.repository }}
          EXPECTED_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if (-not (Test-Path pr-number/pr.txt)) {
            Write-Host "No PR number found, assuming no reminder needed"
            exit 0
          }
          
          # Read and parse as int
          $number = [int](Get-Content pr-number/pr.txt -Raw)
          
          # Validate that the PR's head commit matches the expected hash
          $actualHeadCommit = gh api "repos/$env:BASE_REPO/pulls/$number" --jq .head.sha
          if (-not ($actualHeadCommit -eq $env:EXPECTED_HEAD_COMMIT)) {
            Write-Host "Actual PR head commit does not match expected (Actual: $actualHeadCommit, Expected: $env:EXPECTED_HEAD_COMMIT)"
            Write-Host "If this was because this workflow run had stale information, the next run should already be queued"
            exit 0
          }

          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Download reminder comment
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: ${{ matrix.type }}-reminder-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          
      - name: Get reminder comment pattern
        if: steps.pr.outputs.number != ''
        shell: pwsh
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if ($env:MATRIX_TYPE -eq "native") {
            "pattern=$env:NATIVE_REMINDER_MESSAGE_PATTERN" >> $env:GITHUB_OUTPUT
          } else {
            "pattern=$env:BINDINGS_REMINDER_MESSAGE_PATTERN" >> $env:GITHUB_OUTPUT
          }

      - name: Read reminder comment
        if: steps.pr.outputs.number != ''
        id: comment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if (-not (Test-Path ${{ matrix.type }}.txt)) {
            Write-Host "No reminder comment found, assuming no reminder needed"
            exit 0
          }
          
          $content = Get-Content ${{ matrix.type }}.txt -Raw
          if (-not ($content -match $env:NATIVE_REMINDER_MESSAGE_PATTERN)) {
            Write-Host "Bad reminder message format"
            exit 1
          }
          
          # GitHub allows any delimiter and using a random delimiter is best for security against untrusted content
          $delimiter = [Guid]::NewGuid().ToString()
          "content<<$delimiter" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Find previous reminder comment
        if: steps.pr.outputs.number != '' && steps.comment.outputs.content != ''
        id: previous
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: "github-actions[bot]"
          body-includes: ${{ env.NATIVE_REMINDER_MESSAGE_PATTERN }}
  
      - name: Update reminder comment
        if: steps.pr.outputs.number != '' && steps.comment.outputs.content != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.previous.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: ${{ steps.comment.outputs.content }}
          edit-mode: replace
