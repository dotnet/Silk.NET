name: Post Affected Natives/Bindings Comment (3.0)

on:
  workflow_run:
    workflows:
      - Check Affected Natives/Bindings
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number }}"
  cancel-in-progress: false

jobs:

  pr:
    name: Get PR number
    
    if: github.event.workflow_run.conclusion == 'success'
    
    permissions:
      actions: read
    
    uses: $/.github/workflows/pr-get-info.reusable.yml
    with:
      runId: ${{ github.event.workflow_run.id }}
      repo: ${{ github.repository }}
      expectedHeadCommit: ${{ github.event.workflow_run.head_sha }}

  # Privileged - Must not execute untrusted code
  post:
    name: Post reminder comment
    runs-on: ubuntu-latest
    
    needs: [pr]
    if: needs.pr.outputs.prNumber != ''
    
    permissions:
      pull-requests: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        type:
          - native
          - bindings

    env: 
      NATIVE_REMINDER_MESSAGE_PATTERN: |
        ## Silk.NET native build reminder
      BINDINGS_REMINDER_MESSAGE_PATTERN: |
        ## Silk.NET bindings regeneration reminder

    steps:

      - name: Download reminder comment
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: ${{ matrix.type }}-reminder-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          
      - name: Get reminder comment pattern
        id: pattern
        shell: pwsh
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if ($env:MATRIX_TYPE -eq "native") {
            "pattern=$env:NATIVE_REMINDER_MESSAGE_PATTERN" >> $env:GITHUB_OUTPUT
          } else {
            "pattern=$env:BINDINGS_REMINDER_MESSAGE_PATTERN" >> $env:GITHUB_OUTPUT
          }

      - name: Read reminder comment
        id: comment
        shell: pwsh
        env:
          REMINDER_MESSAGE_PATTERN: ${{ steps.pattern.outputs.pattern }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if (-not (Test-Path ${{ matrix.type }}.txt)) {
            Write-Host "No reminder comment found, assuming no reminder needed"
            exit 0
          }
          
          $content = Get-Content ${{ matrix.type }}.txt -Raw
          if (-not ($content -match $env:REMINDER_MESSAGE_PATTERN)) {
            Write-Host "Bad reminder message format"
            exit 1
          }
          
          # GitHub allows any delimiter and using a random delimiter is best for security against untrusted content
          $delimiter = [Guid]::NewGuid().ToString()
          "content<<$delimiter" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Find previous reminder comment
        if: steps.comment.outputs.content != ''
        id: previous
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: "github-actions[bot]"
          body-includes: ${{ steps.pattern.outputs.pattern }}
  
      - name: Update reminder comment
        if: steps.comment.outputs.content != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.previous.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: ${{ steps.comment.outputs.content }}
          edit-mode: replace
