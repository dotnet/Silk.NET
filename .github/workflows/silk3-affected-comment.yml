name: Post Affected Natives/Bindings Comment (Silk 3)

on:
  workflow_run:
    workflows:
      - Check Affected Natives/Bindings
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number }}"
  cancel-in-progress: false

jobs:

  # Privileged - Must not execute untrusted code
  check:
    name: Post reminder comments
    runs-on: ubuntu-latest
    
    if: github.event.workflow_run.conclusion == 'success'
    
    permissions:
      pull-requests: write
      actions: read

    env: 
      NATIVE_REMINDER_MESSAGE_PATTERN: |
        ## Silk native build reminder
      BINDINGS_REMINDER_MESSAGE_PATTERN: |
        ## Silk bindings regeneration reminder

    steps:

      # Workaround since `github.event.workflow_run.pull_requests[0].number` doesn't work
      - name: Download PR number
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR number
        id: pr
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if (-not (Test-Path pr.txt)) {
            Write-Host "No PR number found, assuming no reminder needed"
            exit 0
          }
          
          $content = Get-Content pr.txt -Raw
          
          $delimiter = [Guid]::NewGuid().ToString()
          "number<<$delimiter" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Download native reminder comment
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: native-reminder-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download bindings reminder comment
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: bindings-reminder-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read native reminder comment
        if: steps.pr.outputs.number != ''
        id: native
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if (-not (Test-Path native.txt)) {
            Write-Host "No reminder comment found, assuming no reminder needed"
            exit 0
          }
          
          $content = Get-Content native.txt -Raw
          if (-not ($content -match $env:NATIVE_REMINDER_MESSAGE_PATTERN)) {
            Write-Host "Bad reminder message format"
            exit 1
          }
          
          # GitHub allows any delimiter and using a random delimiter is best for security
          $delimiter = [Guid]::NewGuid().ToString()
          "content<<$delimiter" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Read bindings reminder comment
        if: steps.pr.outputs.number != ''
        id: bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          if (-not (Test-Path bindings.txt)) {
            Write-Host "No reminder comment found, assuming no reminder needed"
            exit 0
          }
          
          $content = Get-Content bindings.txt -Raw
          if (-not ($content -match $env:BINDINGS_REMINDER_MESSAGE_PATTERN)) {
            Write-Host "Bad reminder message format"
            exit 1
          }
          
          $delimiter = [Guid]::NewGuid().ToString()
          "content<<$delimiter" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Find previous native reminder comment
        if: steps.pr.outputs.number != '' && steps.native.outputs.content != ''
        id: previousNative
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: "github-actions[bot]"
          body-includes: ${{ env.NATIVE_REMINDER_MESSAGE_PATTERN }}

      - name: Find previous bindings reminder comment
        if: steps.pr.outputs.number != '' && steps.bindings.outputs.content != ''
        id: previousBindings
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: "github-actions[bot]"
          body-includes: ${{ env.BINDINGS_REMINDER_MESSAGE_PATTERN }}
  
      - name: Update native reminder comment
        if: steps.pr.outputs.number != '' && steps.native.outputs.content != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.previousNative.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: ${{ steps.native.outputs.content }}
          edit-mode: replace

      - name: Update bindings reminder comment
        if: steps.pr.outputs.number != '' && steps.bindings.outputs.content != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.previousBindings.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: ${{ steps.bindings.outputs.content }}
          edit-mode: replace
