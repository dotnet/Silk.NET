name: Bindings Regeneration (3.0)

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.issue.number }}"
  cancel-in-progress: false

jobs:
  check:
    name: Check PR comment
    runs-on: ubuntu-latest
    
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/bindings')

    steps:

      - name: Check permission and gather info
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          # Check permissions
          $permission = gh api "repos/$env:REPO/collaborators/$env:COMMENTER/permission" --jq .user.permissions.push
          if ($permission -ne "true") {
            throw "$env:COMMENTER does not have push permissions"
          }
          
          $headRepo = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" --jq .head.repo.full_name
          "headRepo=$headRepo" >> $env:GITHUB_OUTPUT
          
          $headCommit = gh api "repos/$env:REPO/pulls/$env:PR_NUMBER" --jq .head.sha
          "headCommit=$headCommit" >> $env:GITHUB_OUTPUT
          
          # Check if PR is for Silk 3
          $isSilk3 = $false
          try {
            gh api "repos/$headRepo/contents/eng?ref=$headCommit" --silent
            $isSilk3 = $true
          } catch {}
          
          "isSilk3=$isSilk3" >> $env:GITHUB_OUTPUT

    outputs:
      commentBody: ${{ github.event.comment.body }}
      baseRepo: ${{ github.repository }}
      headRepo: ${{ steps.check.outputs.headRepo }}
      headCommit: ${{ steps.check.outputs.headCommit }}
      isSilk3: ${{ steps.check.outputs.isSilk3 }}

  # Be careful - Executes untrusted code
  dispatch:
    name: Dispatch selected jobs
    runs-on: ubuntu-latest
      
    needs: [check]
    if: ${{ needs.check.outputs.isSilk3 == 'true' }}
    
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}
          submodules: false

      - name: Parse comment as command
        id: command
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          COMMENT_BODY: ${{ needs.check.outputs.commentBody }}
        run: ./workflow-parse.ps1 >> $env:GITHUB_OUTPUT

      - name: Generate matrix
        id: matrix
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          CHOSEN_JOBS: ${{ steps.command.outputs.jobs }}
        run: ./workflow-matrix.ps1 >> $env:GITHUB_OUTPUT

    outputs:
      scrapeMatrix: ${{ steps.matrix.outputs.scrapeMatrix }}
      regenerateMatrix: ${{ steps.matrix.outputs.regenerateMatrix }}
