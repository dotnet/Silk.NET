name: Bindings Regeneration (3.0)

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.comment.body, '/bindings') && format('{0}-{1}', github.workflow, github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  
  # Unprivileged - Should not need to execute untrusted code
  check:
    name: Check PR comment
    runs-on: ubuntu-latest
    
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/bindings')

    steps:

      - name: Check permission and gather info
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Checking if commenter has push permissions"
          $rawPermission = gh api "repos/$env:BASE_REPO/collaborators/$env:COMMENTER/permission" --jq .user.permissions.push
          $hasPermission = $rawPermission -eq "true"
          if (-not $hasPermission) {
            Write-Host "$env:COMMENTER does not have push permissions"
            exit 0
          } else {
            Write-Host "$env:COMMENTER has push permissions"
          }
          "hasPermission=$hasPermission" >> $env:GITHUB_OUTPUT
          
          $headRepo = gh api "repos/$env:BASE_REPO/pulls/$env:PR_NUMBER" --jq .head.repo.full_name
          "headRepo=$headRepo" >> $env:GITHUB_OUTPUT
          
          $headBranch = gh api "repos/$env:BASE_REPO/pulls/$env:PR_NUMBER" --jq .head.ref
          "headBranch=$headBranch" >> $env:GITHUB_OUTPUT
          
          $headCommit = gh api "repos/$env:BASE_REPO/pulls/$env:PR_NUMBER" --jq .head.sha
          "headCommit=$headCommit" >> $env:GITHUB_OUTPUT
          
          # Check if PR is for Silk 3
          $isSilk3 = $false
          try {
            Write-Host "Checking for eng folder as a naive way to check if the PR is for Silk 3"
            gh api "repos/$headRepo/contents/eng?ref=$headCommit" --silent
            $isSilk3 = $true
          } catch {
            Write-Host "PR does not target Silk 3"
            exit 0
          }
          
          Write-Host "PR does target Silk 3"
          "isSilk3=$isSilk3" >> $env:GITHUB_OUTPUT
          
          exit 0

    outputs:
      commentBody: ${{ github.event.comment.body }}
      headRepo: ${{ steps.check.outputs.headRepo }}
      headBranch: ${{ steps.check.outputs.headBranch }}
      headCommit: ${{ steps.check.outputs.headCommit }} # Untrusted: Head may be from a fork
      isSilk3: ${{ steps.check.outputs.isSilk3 }}
      hasPermission: ${{ steps.check.outputs.hasPermission }}
  
  # Privileged - Must not execute untrusted code
  dryPush:
    name: Test push permissions
    runs-on: ubuntu-latest
    
    permissions: 
      contents: write
    
    needs: [check]
    if: needs.check.outputs.isSilk3 == 'true' && needs.check.outputs.headRepo != github.repository && needs.check.outputs.hasPermission == 'true'
    
    steps:
    
      - name: Test push permissions with --dry-run push
        id: dryPush
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ needs.check.outputs.headRepo }}
          HEAD_BRANCH: ${{ needs.check.outputs.headBranch }}
          HEAD_COMMIT: ${{ needs.check.outputs.headCommit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest
          
          git init --bare repo.git
          $env:GIT_DIR = "$PWD/repo.git"
          git config core.hooksPath /dev/null
          
          Write-Host "Testing push permissions using a --dry-run push to the head repo"
          $hasPushPermission = $false
          try {
            git fetch --no-recurse-submodules --depth=1 "https://github.com/$env:HEAD_REPO.git" $env:HEAD_COMMIT
            git -c credential.helper= -c "credential.helper=!gh auth git-credential" push --dry-run "https://github.com/$env:HEAD_REPO.git" "FETCH_HEAD:refs/heads/$env:HEAD_BRANCH"
            $hasPushPermission = $true
            Write-Host "Write permissions confirmed"
          }
          catch {
            Write-Host "Write permissions not available"
            Write-Host "This does not fail the workflow so the relevant artifacts are still generated"
          }
          
          "hasPushPermission=$hasPushPermission" >> $env:GITHUB_OUTPUT
          
          exit 0
          
    outputs:
      hasPushPermission: ${{ steps.dryPush.outputs.hasPushPermission }}
  
  # Privileged - Must not execute untrusted code
  reportNoPushPermission:
    name: Report no push permission
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      
    needs: [check, dryPush]
    if: needs.dryPush.outputs.hasPushPermission == 'false' && needs.check.outputs.hasPermission == 'true'

    env:
      PUSH_WARNING_MESSAGE_PATTERN: |
        ## CI does not have permission to push to this PR
      PUSH_WARNING_MESSAGE: |
        ## CI does not have permission to push to this PR
        
        CI will continue to build the requested changes and upload them as artifacts,
        but will not be able to commit and push the changes to this PR.
      
        Please ensure the following:
        - `Allow edits by maintainers` is checked.
        - The fork is a direct fork of `${{ github.repository }}`.
        - The fork belongs to a personal account.
      
        We have found that GitHub blocks pushes when any of these conditions are not satisfied.

    steps:
    
      - name: Find previous comment if it exists
        uses: peter-evans/find-comment@v4
        id: previousComment
        with:
          issue-number: ${{ github.event.issue.number }}
          comment-author: "github-actions[bot]"
          body-includes: ${{ env.PUSH_WARNING_MESSAGE_PATTERN }}
  
      - name: Update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.previousComment.outputs.comment-id }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ env.PUSH_WARNING_MESSAGE }}
          edit-mode: replace

  # Unprivileged - Executes untrusted code
  dispatch:
    name: Dispatch selected jobs
    runs-on: ubuntu-latest

    needs: [check]
    if: needs.check.outputs.isSilk3 == 'true' && needs.check.outputs.hasPermission == 'true'

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}
          submodules: false

      - name: Parse comment as command
        id: command
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          COMMENT_BODY: ${{ needs.check.outputs.commentBody }}
        run: ./workflow-parse.ps1 >> $env:GITHUB_OUTPUT

      - name: Generate matrix
        id: matrix
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          CHOSEN_JOBS: ${{ steps.command.outputs.jobs }}
        run: ./workflow-matrix.ps1 >> $env:GITHUB_OUTPUT

    outputs:
      scrapeMatrix: ${{ steps.matrix.outputs.scrapeMatrix }}
      regenerateMatrix: ${{ steps.matrix.outputs.regenerateMatrix }}
  
  # Unprivileged - Executes untrusted code
  scrape:
    name: Scrape ${{ matrix.job }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    needs: [check, dispatch]
    if: join(fromJSON(needs.dispatch.outputs.scrapeMatrix), ',') != '' && needs.check.outputs.hasPermission == 'true'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.scrapeMatrix) }}

    steps:

      # Currently deciding to install all dependencies for all bindings for simplicity
      # Reason is that dependencies here are relatively light, unlike for native builds
      - name: Setup dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          switch ($true) {
            $IsWindows {}
            $IsLinux {
              sudo apt-get update

              # Added for OpenXR
              sudo apt-get install -y libx11-dev libgl-dev libglx-dev libxcb1-dev libxcb-glx0-dev libegl-dev
            }
            $IsMacOS {}
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: Setup Windows SDK
        if: "runner.os == 'Windows'"
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 22621

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Initialize submodules
        shell: pwsh
        env:
          SUBMODULES: ${{ toJSON(matrix.submodules) }}
        run: |
          $submodules = @($env:SUBMODULES | ConvertFrom-Json)
          if ($submodules.Count -gt 0) {
            git submodule update --init --recursive --depth 1 $submodules
          }

      - name: Clear .silktouch folder contents
        shell: pwsh
        run: Remove-Item -Path .silktouch -Recurse -Force

      - name: .NET workload restore
        shell: pwsh
        run: dotnet workload restore

      - name: .NET restore
        shell: pwsh
        run: dotnet restore

      - name: Populate caches
        shell: pwsh
        env:
          JOB: ${{ matrix.job }}
        run: dotnet run --project sources/SilkTouch/Jobs/Silk.NET.SilkTouch.Jobs.csproj -c Release -- --generate-cache-only --only $env:JOB

      - name: Show .silktouch folder contents
        shell: pwsh
        run: Get-ChildItem .silktouch

      - name: Upload cache as artifact
        uses: actions/upload-artifact@v7
        with:
          name: silktouch-cache-${{ matrix.job }}-${{ matrix.os }}
          path: .silktouch
          include-hidden-files: true
  
  # Privileged - Must not execute untrusted code
  combine:
    name: Combine caches
    runs-on: ubuntu-24.04

    needs: [check, scrape]
    if: ${{ !cancelled() && needs.check.outputs.isSilk3 == 'true' && needs.check.outputs.hasPermission == 'true' }}

    steps:

      - name: Download cache
        uses: actions/download-artifact@v8
        with:
          path: .silktouch
          pattern: silktouch-cache-*
          merge-multiple: true

      - name: Show .silktouch folder contents
        shell: pwsh
        run: Get-ChildItem .silktouch

      - name: Upload cache
        uses: actions/upload-artifact@v7
        with:
          name: silktouch-combined-cache
          path: .silktouch
          include-hidden-files: true
  
  # Unprivileged - Executes untrusted code
  regenerate:
    name: Regenerate ${{ matrix.job }}
    runs-on: ubuntu-24.04

    needs: [check, dispatch, combine]
    if: join(fromJSON(needs.dispatch.outputs.regenerateMatrix), ',') != '' && needs.check.outputs.hasPermission == 'true'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.regenerateMatrix) }}

    steps:

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Initialize submodules
        shell: pwsh
        env:
          SUBMODULES: ${{ toJSON(matrix.submodules) }}
        run: |
          $submodules = $env:SUBMODULES | ConvertFrom-Json
          git submodule update --init --recursive --depth 0 $submodules

      - name: Download cache
        uses: actions/download-artifact@v8
        with:
          path: .silktouch
          pattern: silktouch-combined-cache

      - name: Show .silktouch folder contents
        shell: pwsh
        run: Get-ChildItem .silktouch

      - name: Show git status
        shell: pwsh
        run: git status

      - name: .NET workload restore
        shell: pwsh
        run: dotnet workload restore

      - name: .NET restore
        shell: pwsh
        run: dotnet restore

      - name: Regenerate bindings
        shell: pwsh
        env:
          JOB: ${{ matrix.job }}
        run: dotnet run --project sources/SilkTouch/Jobs/Silk.NET.SilkTouch.Jobs.csproj -c Release -- --use-cache-only --only $env:JOB

      - name: Show git status
        shell: pwsh
        run: git status

      - name: Create bindings patch
        id: patch
        shell: pwsh
        env:
          JOB: ${{ matrix.job }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Creating a patch containing all changes but the cache. The cache will be committed later."
          git add -A
          git diff --cached --binary -- . ":(exclude).silktouch" > "bindings-$env:JOB.patch"

          if ((Get-Item "bindings-$env:JOB.patch").Length -eq 0) {
            Write-Host "Bindings already up to date"
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Upload bindings patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-patch-${{ matrix.job }}
          path: bindings-${{ matrix.job }}.patch
  
  # Unprivileged - Executes untrusted code
  bundle:
    name: Generate bundle
    runs-on: ubuntu-latest

    needs: [check, regenerate]
    if: needs.check.outputs.hasPermission == 'true'

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Download cache
        uses: actions/download-artifact@v8
        with:
          path: .silktouch
          pattern: silktouch-combined-cache

      - name: Download bindings patches
        uses: actions/download-artifact@v8
        with:
          path: patches
          pattern: bindings-patch-*
          merge-multiple: true

      - name: Create bundle
        id: bundle
        shell: pwsh
        env:
          HEAD_COMMIT: ${{ needs.check.outputs.headCommit }}
          HEAD_BRANCH: ${{ needs.check.outputs.headBranch }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          git config --local user.email "9011267+dotnet-bot@users.noreply.github.com"
          git config --local user.name "The Silk.NET Automaton"

          git switch -c ci/bindings

          git status

          # Cache
          git add .silktouch
          if (git status --porcelain --untracked-files=no) {
            git commit -m "Update .silktouch cache for $env:HEAD_COMMIT"
          }

          # Bindings, one commit per job
          if (Test-Path patches) {
            foreach ($patch in Get-ChildItem patches -Filter "bindings-*.patch") {
              $job = $patch.BaseName.Substring("bindings-".Length)
              git apply --index $patch.FullName
              git commit -m "Regenerate $job bindings for $env:HEAD_COMMIT"
            }
          }

          git status

          # Pull in case there were commits pushed since the start of the workflow
          Write-Host "Pulling any new changes"
          git pull --rebase origin $env:HEAD_BRANCH
          
          $newHeadCommit = git rev-parse FETCH_HEAD
          if ((git rev-parse HEAD) -eq $newHeadCommit) {
            Write-Host "No commits to bundle"
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          Write-Host "Creating bundle"
          git bundle create bindings.bundle "$newHeadCommit..ci/bindings"
          "newHeadCommit=$newHeadCommit" >> $env:GITHUB_OUTPUT
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Upload bundle
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-bundle
          path: bindings.bundle

    outputs: 
      changed: ${{ steps.bundle.outputs.changed }}
      newHeadCommit: ${{ steps.bundle.outputs.newHeadCommit }}

  # Privileged - Must not execute untrusted code
  push:
    name: Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    needs: [check, bundle]
    if: needs.bundle.outputs.changed == 'true'

    steps:

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-bundle

      - name: Show working directory contents
        shell: pwsh
        run: Get-ChildItem

      - name: Apply bundle
        shell: pwsh
        env:
          HEAD_REPO: ${{ needs.check.outputs.headRepo }}
          HEAD_COMMIT: ${{ needs.bundle.outputs.newHeadCommit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Creating bare repo"
          git init --bare repo.git
          $env:GIT_DIR = "$PWD/repo.git"
          git config core.hooksPath /dev/null
          git config transfer.fsckObjects true
          
          Write-Host "Applying bundle"
          git fetch --no-recurse-submodules --depth=1 "https://github.com/$env:HEAD_REPO.git" $env:HEAD_COMMIT
          git bundle verify bindings.bundle
          git fetch --no-recurse-submodules bindings.bundle refs/heads/ci/bindings
          git update-ref refs/heads/ci/bindings FETCH_HEAD

      - name: Push
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ needs.check.outputs.headRepo }}
          HEAD_BRANCH: ${{ needs.check.outputs.headBranch }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Pushing"
          $env:GIT_DIR = "$PWD/repo.git"
          git -c credential.helper= -c "credential.helper=!gh auth git-credential" push "https://github.com/$env:HEAD_REPO.git" "refs/heads/ci/bindings:refs/heads/$env:HEAD_BRANCH"
          Write-Host "Push successful"
