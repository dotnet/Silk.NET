# This workflow has a lot of duplicated code shared with silk3-native.yml
name: Bindings Regeneration (3.0)

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  # Only share a concurrency group if the comment contains /bindings
  # This is to prevent ordinary comments from replacing pending /bindings runs
  # GitHub only runs the last pending run
  group: ${{ contains(github.event.comment.body, '/bindings') && format('{0}-{1}', github.workflow, github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  
  check:
    name: Check PR and gather info
    
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/bindings')
    
    uses: $/.github/workflows/pr-check-workflow-push-permissions.reusable.yml
    with:
      prNumber: ${{ github.event.issue.number }}
      baseRepo: ${{ github.repository }}
      commenter: ${{ github.event.comment.user.login }}
  
  checkPushPermissions:
    name: Check PR push permissions
    
    needs: [check]
    if: needs.check.outputs.isSilk3 == 'true'
    
    permissions:
      contents: write
      pull-requests: write
    
    uses: $/.github/workflows/pr-check-workflow-push-permissions.reusable.yml
    with:
      prNumber: ${{ github.event.issue.number }}
      baseRepo: ${{ github.repository }}
      headRepo: ${{ needs.check.outputs.headRepo }}
      headBranch: ${{ needs.check.outputs.headBranch }}
      headCommit: ${{ needs.check.outputs.headCommit }}

  # Unprivileged - Executes untrusted code
  # dispatch here is very similar to dispatch in silk3-native.yml
  dispatch:
    name: Dispatch selected jobs
    runs-on: ubuntu-latest

    needs: [check]
    if: needs.check.outputs.isSilk3 == 'true'

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}
          submodules: false

      - name: Parse comment as command
        id: command
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          COMMENT_BODY: ${{ needs.check.outputs.commentBody }}
        run: ./parse.ps1 >> $env:GITHUB_OUTPUT

      - name: Generate matrix
        id: matrix
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          CHOSEN_JOBS: ${{ steps.command.outputs.jobs }}
        run: ./matrix.ps1 >> $env:GITHUB_OUTPUT

    outputs:
      scrapeMatrix: ${{ steps.matrix.outputs.scrapeMatrix }}
      regenerateMatrix: ${{ steps.matrix.outputs.regenerateMatrix }}
  
  # Unprivileged - Executes untrusted code
  scrape:
    name: Scrape ${{ matrix.job }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    needs: [check, dispatch]
    if: join(fromJSON(needs.dispatch.outputs.scrapeMatrix), ',') != ''

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.scrapeMatrix) }}

    steps:

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: Setup Windows SDK
        if: "runner.os == 'Windows'"
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 22621

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Ensure prerequisites
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          JOB: ${{ matrix.job }}
        run: ./prerequisites.ps1 --apply

      - name: Clear .silktouch folder contents
        shell: pwsh
        run: Remove-Item -Path ".silktouch/*" -Recurse -Force

      - name: Populate caches
        shell: pwsh
        env:
          JOB: ${{ matrix.job }}
        run: dotnet run --project sources/SilkTouch/Jobs/Silk.NET.SilkTouch.Jobs.csproj -c Release -- --generate-cache-only --only $env:JOB

      - name: Show .silktouch folder contents
        shell: pwsh
        run: Get-ChildItem .silktouch

      - name: Upload cache as artifact
        uses: actions/upload-artifact@v7
        with:
          name: silktouch-cache-${{ matrix.job }}-${{ matrix.os }}
          path: .silktouch
          include-hidden-files: true
  
  # Privileged - Must not execute untrusted code
  combine:
    name: Combine caches
    runs-on: ubuntu-24.04

    needs: [check, scrape]
    if: ${{ !cancelled() && needs.check.outputs.isSilk3 == 'true' && join(fromJSON(needs.dispatch.outputs.scrapeMatrix), ',') != '' }}

    steps:

      - name: Download cache
        uses: actions/download-artifact@v8
        with:
          path: .silktouch
          pattern: silktouch-cache-*
          merge-multiple: true

      - name: Show .silktouch folder contents
        shell: pwsh
        run: Get-ChildItem .silktouch -ErrorAction Ignore

      - name: Upload cache
        uses: actions/upload-artifact@v7
        with:
          name: silktouch-combined-cache
          path: .silktouch
          include-hidden-files: true
          if-no-files-found: "ignore"
  
  # Unprivileged - Executes untrusted code
  regenerate:
    name: Regenerate ${{ matrix.job }}
    runs-on: ubuntu-24.04

    needs: [check, dispatch, combine]
    if: join(fromJSON(needs.dispatch.outputs.regenerateMatrix), ',') != ''

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dispatch.outputs.regenerateMatrix) }}

    steps:

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Ensure prerequisites
        shell: pwsh
        working-directory: eng/workflows/bindings
        env:
          JOB: ${{ matrix.job }}
        run: ./prerequisites.ps1 --apply
          
      - name: Download cache
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: .silktouch
          pattern: silktouch-combined-cache
      
      - name: Show .silktouch folder contents
        shell: pwsh
        run: Get-ChildItem .silktouch

      - name: Show git status
        shell: pwsh
        run: git status

      - name: Regenerate bindings
        shell: pwsh
        env:
          JOB: ${{ matrix.job }}
        run: dotnet run --project sources/SilkTouch/Jobs/Silk.NET.SilkTouch.Jobs.csproj -c Release -- --use-cache-only --only $env:JOB

      - name: Show git status
        shell: pwsh
        run: git status

      - name: Create bindings patch
        id: patch
        shell: pwsh
        env:
          JOB: ${{ matrix.job }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          Write-Host "Creating a patch containing all changes but the cache. The cache will be committed later."
          git add -A
          git diff --cached --binary -- . ":(exclude).silktouch" > "bindings-$env:JOB.patch"

          if ((Get-Item "bindings-$env:JOB.patch").Length -eq 0) {
            Write-Host "Bindings already up to date"
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Upload bindings patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-patch-${{ matrix.job }}
          path: bindings-${{ matrix.job }}.patch
  
  # Unprivileged - Executes untrusted code
  # bundle here is very similar to bundle in silk3-native.yml
  bundle:
    name: Generate bundle
    runs-on: ubuntu-latest

    needs: [check, regenerate]

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
          repository: ${{ needs.check.outputs.headRepo }}
          ref: ${{ needs.check.outputs.headCommit }}

      - name: Download cache
        uses: actions/download-artifact@v8
        with:
          path: .silktouch
          pattern: silktouch-combined-cache

      - name: Download bindings patches
        uses: actions/download-artifact@v8
        with:
          path: patches
          pattern: bindings-patch-*
          merge-multiple: true

      - name: Create bundle
        id: bundle
        shell: pwsh
        env:
          HEAD_COMMIT: ${{ needs.check.outputs.headCommit }}
          HEAD_BRANCH: ${{ needs.check.outputs.headBranch }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Set-StrictMode -Version Latest

          git config --local user.email "9011267+dotnet-bot@users.noreply.github.com"
          git config --local user.name "The Silk.NET Automaton"

          git switch -c ci/bundle

          git status

          # Cache
          git add .silktouch
          if (git status --porcelain --untracked-files=no) {
            git commit -m "Update .silktouch cache for $env:HEAD_COMMIT"
          }

          # Bindings, one commit per job
          if (Test-Path patches) {
            foreach ($patch in Get-ChildItem patches -Filter "bindings-*.patch") {
              $job = $patch.BaseName.Substring("bindings-".Length)
              git apply --index $patch.FullName
              git commit -m "Regenerate $job bindings for $env:HEAD_COMMIT"
            }
          }

          git status

          # Pull in case there were commits pushed since the start of the workflow
          Write-Host "Pulling any new changes"
          git pull --rebase origin $env:HEAD_BRANCH
          
          $newHeadCommit = git rev-parse FETCH_HEAD
          if ((git rev-parse HEAD) -eq $newHeadCommit) {
            Write-Host "No commits to bundle"
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          
          Write-Host "Creating bundle"
          git bundle create git.bundle "$newHeadCommit..ci/bundle"
          "newHeadCommit=$newHeadCommit" >> $env:GITHUB_OUTPUT
          "changed=true" >> $env:GITHUB_OUTPUT

      - name: Upload bundle
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: git-bundle
          path: git.bundle

    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
      newHeadCommit: ${{ steps.bundle.outputs.newHeadCommit }}

  push:
    name: Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    needs: [check, bundle]
    if: needs.bundle.outputs.changed == 'true'

    uses: $/.github/workflows/pr-check-workflow-push-permissions.reusable.yml
    with:
      headRepo: ${{ needs.check.outputs.headRepo }}
      headBranch: ${{ needs.check.outputs.headBranch }}
      headCommit: ${{ needs.bundle.outputs.newHeadCommit }}
      bundleArtifact: git-bundle
      bundlePath: git.bundle
