name: Check Affected Natives/Bindings

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number }}"
  cancel-in-progress: false

jobs:

  # Unprivileged - Executes untrusted code
  check:
    name: Check affected natives/bindings
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Identify native job dependencies
        id: nativeDependencies
        shell: pwsh
        working-directory: eng/workflows
        env:
          COMMENT_BODY: ${{ github.event.pull_request.body }}
        run: ./native/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Identify bindings job dependencies
        id: bindingsDependencies
        shell: pwsh
        working-directory: eng/workflows
        env:
          COMMENT_BODY: ${{ github.event.pull_request.body }}
        run: ./bindings/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Determine which native jobs need to be reran
        id: nativeAffected
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.nativeDependencies.outputs.workflowFilters }}

      - name: Determine which bindings jobs need to be reran
        id: bindingsAffected
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.bindingsDependencies.outputs.workflowFilters }}

      - name: Generate native reminder message
        id: nativeReminder
        shell: pwsh
        env:
          AFFECTED_JOBS: ${{ steps.nativeAffected.outputs.changes }}
        run: ./native/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Generate bindings reminder message
        id: bindingsReminder
        shell: pwsh
        env:
          AFFECTED_JOBS: ${{ steps.bindingsAffected.outputs.changes }}
        run: ./bindings/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

