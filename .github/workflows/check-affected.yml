name: Check Affected Natives/Bindings

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number }}"
  cancel-in-progress: false

jobs:

  # Unprivileged - Executes untrusted code
  check:
    name: Check affected natives/bindings
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: false
          path: repo

      - name: Identify native job dependencies
        id: nativeDependencies
        shell: pwsh
        working-directory: repo/eng/workflows
        run: ./native/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Identify bindings job dependencies
        id: bindingsDependencies
        shell: pwsh
        working-directory: repo/eng/workflows
        run: ./bindings/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Determine which native jobs need to be reran
        id: nativeAffected
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.nativeDependencies.outputs.workflowFilters }}

      - name: Determine which bindings jobs need to be reran
        id: bindingsAffected
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.bindingsDependencies.outputs.workflowFilters }}

      - name: Generate native reminder message
        id: nativeReminder
        shell: pwsh
        working-directory: repo/eng/workflows
        env:
          AFFECTED_JOBS: ${{ steps.nativeAffected.outputs.changes }}
        run: ./native/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Generate bindings reminder message
        id: bindingsReminder
        shell: pwsh
        working-directory: repo/eng/workflows
        env:
          AFFECTED_JOBS: ${{ steps.bindingsAffected.outputs.changes }}
        run: ./bindings/workflow-dependencies.ps1 >> $env:GITHUB_OUTPUT

      - name: Output native reminder to file
        if: ${{ steps.nativeReminder.outputs.comment }}
        shell: pwsh
        env:
          COMMENT: ${{ steps.nativeReminder.outputs.comment }}
        run: $env:COMMENT > native.txt

      - name: Output bindings reminder to file
        if: ${{ steps.bindingsReminder.outputs.comment }}
        shell: pwsh
        env:
          COMMENT: ${{ steps.bindingsReminder.outputs.comment }}
        run: $env:COMMENT > bindings.txt

      - name: Upload native reminder
        if: ${{ steps.nativeReminder.outputs.comment }}
        uses: actions/upload-artifact@v7
        with:
          name: native-reminder-comment
          path: native.txt

      - name: Upload bindings reminder
        if: ${{ steps.bindingsReminder.outputs.comment }}
        uses: actions/upload-artifact@v7
        with:
          name: bindings-reminder-comment
          path: bindings.txt

